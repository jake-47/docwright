[book]
title = "Docwright"
authors = ["Jake S"]
description = "Empowering students with tools of power and productivity"
src = "src"

[output.html]
additional-js = ["version.js", "custom.js"]
additional-css = ["custom.css"]
hash-files = false
default-theme = "light"
preferred-dark-theme = "ayu"
site-url = "/docwright/"
edit-url-template = "https://github.com/jake-47/docwright/edit/main/{path}"

[output.html.playground]
runnable = false
